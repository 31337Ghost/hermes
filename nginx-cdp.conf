server {
    listen 9223;

    location / {
        proxy_pass http://host.docker.internal:9222;

        proxy_http_version 1.1;

        # Chrome CDP принимает localhost, но не host.docker.internal
        proxy_set_header Host localhost:9222;

        # WebSocket для CDP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Переписываем discovery JSON, чтобы Hermes получил Docker-доступный WS URL
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'ws://localhost:9222' 'ws://cdp-proxy:9223';
        sub_filter 'ws://127.0.0.1:9222' 'ws://cdp-proxy:9223';
    }
}